name: Main Multi-Lane Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 泳道 1
  service-alpha:
    uses: ./.github/workflows/reusable-pipeline.yml
    with:
      target: service-alpha

  # 泳道 2（与 1 完全并行）
  service-beta:
    uses: ./.github/workflows/reusable-pipeline.yml
    with:
      target: service-beta

  # 泳道 3（与 1、2 完全并行）
  service-gamma:
    uses: ./.github/workflows/reusable-pipeline.yml
    with:
      target: service-gamma